name: CI/CD Pipeline with docker html, css
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6


      - name: Check website files
        run: |
            test -f index.html
            test -f style.css

      - name: Builder docker image
        run: docker build -t my-website:latest

      - name: Docker container
        run: docker run -d --name website-container -p 8080:80 my-website:latest

      - name: Test website
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/ \
              -o /tmp/website.html; then
              break
            fi
            sleep 2
          done

          grep -qi "<html" /tmp/website.html
      - name: Stop container
        if: always()
        run: docker rm -f website-test || true
