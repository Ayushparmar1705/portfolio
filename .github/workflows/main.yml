
name: Deploy Website to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-website .

      - name: Save Docker image
        run: docker save my-website -o website.tar

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: website.tar
          target: /home/ubuntu/

      - name: Run website on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker load -i /home/ubuntu/website.tar
            docker rm -f my-website || true
            docker run -d --name my-website \
              --restart unless-stopped \
              -p 80:80 my-website
            rm -f /home/ubuntu/website.tar
